[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/src/",
    "@uniswap/v4-periphery/=lib/v4-periphery/src/",
]

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 1000 }

[rpc_endpoints]
# Official testnet docs list 1952; some chain lists show 195. Set via .env.
xlayer_testnet = "${XLAYER_RPC_URL}"
xlayer_mainnet = "https://rpc.xlayer.tech"

[etherscan]
xlayer_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://web3.okx.com/explorer/xlayer-test/api" }
xlayer_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://web3.okx.com/explorer/xlayer/api" }
