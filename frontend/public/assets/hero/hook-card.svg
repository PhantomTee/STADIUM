<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="50%" stop-color="#1e4d35"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(74,222,128,0)"/>
      <stop offset="30%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="rgba(74,222,128,0)"/>
    </linearGradient>
    <linearGradient id="teamA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="teamB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="feeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="cardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="320" height="200" rx="10" fill="url(#cardBg)"/>
  <rect width="320" height="200" rx="10" fill="none" stroke="rgba(74,222,128,0.25)" stroke-width="1"/>

  <!-- Header strip -->
  <rect width="320" height="36" rx="10" fill="url(#headerGrad)"/>
  <rect y="26" width="320" height="10" fill="url(#headerGrad)"/>

  <!-- Header text: V4 MATCH ENGINE -->
  <text x="160" y="14" text-anchor="middle" font-family="monospace" font-size="7" font-weight="700" letter-spacing="3" fill="rgba(74,222,128,0.7)">UNISWAP V4 · MATCH ENGINE</text>
  <text x="160" y="27" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#4ade80">STADIUM HOOK</text>

  <!-- Accent line below header -->
  <rect x="0" y="36" width="320" height="1" fill="url(#accentLine)"/>

  <!-- Live badge -->
  <rect x="270" y="8" width="36" height="14" rx="7" fill="rgba(239,68,68,0.2)" stroke="rgba(239,68,68,0.5)" stroke-width="1"/>
  <circle cx="280" cy="15" r="3" fill="#ef4444" filter="url(#textGlow)"/>
  <text x="292" y="19" text-anchor="middle" font-family="monospace" font-size="7" font-weight="700" fill="#ef4444">LIVE</text>

  <!-- Match section -->
  <!-- Team A block -->
  <rect x="12" y="48" width="110" height="60" rx="6" fill="url(#teamA)" opacity="0.15"/>
  <rect x="12" y="48" width="110" height="60" rx="6" fill="none" stroke="rgba(29,78,216,0.4)" stroke-width="1"/>
  <!-- Team A flag strip -->
  <rect x="12" y="48" width="110" height="4" rx="3" fill="#1d4ed8" opacity="0.8"/>
  <!-- Team A info -->
  <text x="67" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="1">TEAM A</text>
  <text x="67" y="85" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="white">ARG</text>
  <text x="67" y="100" text-anchor="middle" font-family="monospace" font-size="7" fill="#60a5fa">POOL: $2.4M</text>

  <!-- VS divider -->
  <text x="160" y="82" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.4)">VS</text>
  <!-- Score line -->
  <line x1="130" y1="78" x2="148" y2="78" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="172" y1="78" x2="190" y2="78" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Stage badge -->
  <rect x="143" y="88" width="34" height="12" rx="6" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.4)" stroke-width="0.75"/>
  <text x="160" y="97" text-anchor="middle" font-family="monospace" font-size="6" fill="#fbbf24" letter-spacing="0.5">FINAL</text>

  <!-- Team B block -->
  <rect x="198" y="48" width="110" height="60" rx="6" fill="url(#teamB)" opacity="0.15"/>
  <rect x="198" y="48" width="110" height="60" rx="6" fill="none" stroke="rgba(220,38,38,0.4)" stroke-width="1"/>
  <rect x="198" y="48" width="110" height="4" rx="3" fill="#dc2626" opacity="0.8"/>
  <text x="253" y="70" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.5)" letter-spacing="1">TEAM B</text>
  <text x="253" y="85" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="white">FRA</text>
  <text x="253" y="100" text-anchor="middle" font-family="monospace" font-size="7" fill="#f87171">POOL: $1.9M</text>

  <!-- Separator -->
  <rect x="12" y="118" width="296" height="1" fill="rgba(255,255,255,0.06)"/>

  <!-- Dynamic Fee row -->
  <text x="16" y="132" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.4)" letter-spacing="1">DYNAMIC FEE</text>
  <text x="304" y="132" text-anchor="end" font-family="monospace" font-size="7" font-weight="700" fill="#4ade80">1.00%</text>
  <!-- Fee bar -->
  <rect x="16" y="135" width="288" height="3" rx="1.5" fill="rgba(255,255,255,0.06)"/>
  <rect x="16" y="135" width="200" height="3" rx="1.5" fill="url(#feeBar)"/>

  <!-- Hook stats row -->
  <g transform="translate(12, 148)">
    <!-- Stat 1 -->
    <rect width="88" height="28" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="44" y="11" text-anchor="middle" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">VOLUME 24H</text>
    <text x="44" y="22" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="white">$847K</text>

    <!-- Stat 2 -->
    <rect x="96" width="88" height="28" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="140" y="11" text-anchor="middle" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">CONVICTION</text>
    <text x="140" y="22" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#4ade80">ACTIVE</text>

    <!-- Stat 3 -->
    <rect x="192" width="88" height="28" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="236" y="11" text-anchor="middle" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">CHAMP POOL</text>
    <text x="236" y="22" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#fbbf24">$124K</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="185" width="320" height="15" rx="10" fill="rgba(255,255,255,0.02)"/>
  <rect y="185" width="320" height="5" fill="rgba(255,255,255,0.02)"/>

  <!-- Hook chain indicator -->
  <text x="16" y="196" font-family="monospace" font-size="6" fill="rgba(74,222,128,0.5)" letter-spacing="1">beforeSwap</text>
  <text x="79" y="196" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.2)">→</text>
  <text x="88" y="196" font-family="monospace" font-size="6" fill="rgba(34,211,238,0.5)" letter-spacing="1">afterSwap</text>
  <text x="143" y="196" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.2)">→</text>
  <text x="152" y="196" font-family="monospace" font-size="6" fill="rgba(251,191,36,0.5)" letter-spacing="1">recordFor</text>
  <text x="207" y="196" font-family="monospace" font-size="6" fill="rgba(255,255,255,0.2)">→</text>
  <text x="216" y="196" font-family="monospace" font-size="6" fill="rgba(167,139,250,0.5)" letter-spacing="1">CHAMPION POOL</text>

  <!-- Corner accent dots -->
  <circle cx="8" cy="8" r="1.5" fill="rgba(74,222,128,0.3)"/>
  <circle cx="312" cy="8" r="1.5" fill="rgba(74,222,128,0.3)"/>
  <circle cx="8" cy="192" r="1.5" fill="rgba(74,222,128,0.3)"/>
  <circle cx="312" cy="192" r="1.5" fill="rgba(74,222,128,0.3)"/>
</svg>
