<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="ballGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#B0B0B0"/>
    </radialGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="35%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- Ball base -->
  <circle cx="100" cy="100" r="88" fill="url(#ballGrad)" filter="url(#shadow)"/>

  <!-- Pentagon patches (black) — classic Telstar pattern, clipped to sphere -->
  <g clip-path="url(#ballClip)" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1">
    <!-- Center top pentagon -->
    <polygon points="100,22 115,32 110,50 90,50 85,32"/>
    <!-- Upper left -->
    <polygon points="44,55 60,48 72,60 62,76 44,74"/>
    <!-- Upper right -->
    <polygon points="156,55 140,48 128,60 138,76 156,74"/>
    <!-- Left -->
    <polygon points="22,110 24,92 40,86 52,98 46,116"/>
    <!-- Right -->
    <polygon points="178,110 176,92 160,86 148,98 154,116"/>
    <!-- Lower left -->
    <polygon points="38,148 52,140 64,152 58,170 38,168"/>
    <!-- Lower right -->
    <polygon points="162,148 148,140 136,152 142,170 162,168"/>
    <!-- Bottom -->
    <polygon points="100,178 115,168 110,150 90,150 85,168"/>
  </g>

  <!-- White hexagon borders (seam lines) -->
  <g clip-path="url(#ballClip)" fill="none" stroke="rgba(180,180,180,0.6)" stroke-width="1.2">
    <!-- Seam lines connecting patches -->
    <line x1="100" y1="50" x2="100" y2="22"/>
    <line x1="85" y1="50" x2="72" y2="60"/>
    <line x1="110" y1="50" x2="128" y2="60"/>
    <line x1="62" y1="76" x2="46" y2="86"/>
    <line x1="138" y1="76" x2="154" y2="86"/>
    <line x1="44" y1="74" x2="44" y2="92"/>
    <line x1="156" y1="74" x2="156" y2="92"/>
    <line x1="52" y1="98" x2="64" y2="110"/>
    <line x1="148" y1="98" x2="136" y2="110"/>
    <line x1="52" y1="116" x2="52" y2="140"/>
    <line x1="148" y1="116" x2="148" y2="140"/>
    <line x1="64" y1="152" x2="85" y2="150"/>
    <line x1="136" y1="152" x2="115" y2="150"/>
    <line x1="90" y1="150" x2="90" y2="178"/>
    <line x1="110" y1="150" x2="110" y2="178"/>
  </g>

  <!-- Specular shine -->
  <ellipse cx="72" cy="62" rx="22" ry="16" fill="url(#shine)" transform="rotate(-25 72 62)"/>

  <!-- Subtle equator shadow -->
  <ellipse cx="100" cy="186" rx="72" ry="12" fill="rgba(0,0,0,0.22)"/>
</svg>
