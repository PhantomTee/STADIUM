<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="gA" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#F9D423"/>
      <stop offset="70%" stop-color="#F0A500"/>
      <stop offset="100%" stop-color="#C77B00"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77B00"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#C77B00"/>
    </linearGradient>
    <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92600A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Stars -->
  <g fill="#FBBF24" opacity="0.95">
    <polygon points="100,8 102.4,14.8 109.6,14.8 103.8,19 106.2,25.8 100,21.6 93.8,25.8 96.2,19 90.4,14.8 97.6,14.8"/>
    <polygon points="72,18 73.7,23 79,23 74.7,26.1 76.4,31.1 72,28 67.6,31.1 69.3,26.1 65,23 70.3,23" transform="scale(0.75) translate(24,8)"/>
    <polygon points="128,18 129.7,23 135,23 130.7,26.1 132.4,31.1 128,28 123.6,31.1 125.3,26.1 121,23 126.3,23" transform="scale(0.75) translate(-24,8)"/>
  </g>

  <!-- Cup body -->
  <path d="M58 50 L54 138 Q54 186 100 200 Q146 186 146 138 L142 50 Z"
        fill="url(#gA)" filter="url(#glow)"/>

  <!-- Horizontal band on cup -->
  <path d="M55 95 Q100 99 145 95" stroke="rgba(0,0,0,0.12)" stroke-width="2" fill="none"/>

  <!-- Rim at top -->
  <rect x="52" y="46" width="96" height="10" rx="5" fill="url(#gB)"/>

  <!-- Left handle -->
  <path d="M58 72 Q24 72 24 105 Q24 138 58 138" stroke="url(#gB)" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M58 72 Q26 72 26 105 Q26 136 58 136" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Right handle -->
  <path d="M142 72 Q176 72 176 105 Q176 138 142 138" stroke="url(#gB)" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M142 72 Q174 72 174 105 Q174 136 142 136" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Shine left -->
  <path d="M71 56 Q78 52 82 75 Q85 95 83 118" stroke="rgba(255,255,255,0.38)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Stem -->
  <rect x="88" y="200" width="24" height="38" rx="3" fill="url(#gC)"/>
  <!-- Stem highlight -->
  <rect x="92" y="202" width="6" height="34" rx="2" fill="rgba(255,255,255,0.18)"/>

  <!-- Base platform -->
  <rect x="45" y="238" width="110" height="22" rx="11" fill="url(#gB)"/>
  <rect x="50" y="241" width="100" height="15" rx="7" fill="rgba(255,255,255,0.12)"/>

  <!-- Engraving on cup body -->
  <path d="M78 155 Q100 160 122 155" stroke="rgba(255,200,0,0.35)" stroke-width="1" fill="none"/>
  <path d="M75 165 Q100 170 125 165" stroke="rgba(255,200,0,0.25)" stroke-width="1" fill="none"/>

  <!-- Inner shadow at base of cup -->
  <ellipse cx="100" cy="198" rx="26" ry="7" fill="rgba(0,0,0,0.15)"/>
</svg>
