<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial glow behind wordmark -->
    <radialGradient id="glow-left" cx="12%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip everything to card bounds -->
    <clipPath id="card">
      <rect x="24" y="24" width="1152" height="582"/>
    </clipPath>
  </defs>

  <!-- Outer background -->
  <rect width="1200" height="630" fill="#080e08"/>

  <!-- Card fill -->
  <rect x="24" y="24" width="1152" height="582" fill="#0d160d"/>

  <!-- Card border -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#1c2c1c" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="24" y="24" width="4" height="582" fill="#00ff87"/>

  <!-- Clipped group: everything that should stay inside the card -->
  <g clip-path="url(#card)">

    <!-- Pitch stripe pattern (very subtle) -->
    <rect x="0"    y="0" width="100" height="630" fill="#00ff87" fill-opacity="0.014"/>
    <rect x="200"  y="0" width="100" height="630" fill="#00ff87" fill-opacity="0.014"/>
    <rect x="400"  y="0" width="100" height="630" fill="#00ff87" fill-opacity="0.014"/>
    <rect x="600"  y="0" width="100" height="630" fill="#00ff87" fill-opacity="0.014"/>
    <rect x="800"  y="0" width="100" height="630" fill="#00ff87" fill-opacity="0.014"/>
    <rect x="1000" y="0" width="100" height="630" fill="#00ff87" fill-opacity="0.014"/>

    <!-- Left glow -->
    <rect x="24" y="24" width="1152" height="582" fill="url(#glow-left)"/>

    <!-- Giant watermark "11°" -->
    <text x="600" y="500" font-family="Arial Black, Arial, sans-serif" font-size="440"
          font-weight="900" fill="#00ff87" fill-opacity="0.028"
          text-anchor="middle" letter-spacing="-20">11°</text>

    <!-- Football (right side) -->
    <!-- Outer circle -->
    <circle cx="970" cy="300" r="172" fill="none" stroke="#00ff87" stroke-width="2" stroke-opacity="0.22"/>
    <circle cx="970" cy="300" r="172" fill="#00ff87" fill-opacity="0.03"/>
    <!-- Inner glow -->
    <circle cx="970" cy="300" r="90" fill="none" stroke="#00ff87" stroke-width="1" stroke-opacity="0.1"/>
    <!-- Center pentagon (simplified football pattern) -->
    <polygon points="970,254 1010,283 995,330 945,330 930,283"
             fill="none" stroke="#00ff87" stroke-width="2.5" stroke-opacity="0.55"/>
    <!-- Seam lines: center pentagon to outer circle -->
    <line x1="970" y1="128" x2="970" y2="254" stroke="#00ff87" stroke-width="1.5" stroke-opacity="0.22"/>
    <line x1="1126" y1="218" x2="1010" y2="283" stroke="#00ff87" stroke-width="1.5" stroke-opacity="0.22"/>
    <line x1="1072" y1="445" x2="995"  y2="330" stroke="#00ff87" stroke-width="1.5" stroke-opacity="0.22"/>
    <line x1="868"  y1="445" x2="945"  y2="330" stroke="#00ff87" stroke-width="1.5" stroke-opacity="0.22"/>
    <line x1="814"  y1="218" x2="930"  y2="283" stroke="#00ff87" stroke-width="1.5" stroke-opacity="0.22"/>

    <!-- Wordmark: 11° -->
    <text x="80" y="200" font-family="Arial Black, Arial, sans-serif"
          font-size="128" font-weight="900" fill="#ffffff" letter-spacing="-4">11°</text>

    <!-- Green underline + "WORLD CUP DEFI" label -->
    <rect x="80" y="222" width="44" height="3" fill="#00ff87"/>
    <text x="140" y="237" font-family="'Courier New', Courier, monospace"
          font-size="20" font-weight="700" fill="#00ff87" letter-spacing="4">WORLD CUP DEFI</text>

    <!-- Tagline -->
    <text x="80" y="318" font-family="Arial Black, Arial, sans-serif"
          font-size="52" font-weight="900" fill="#dce4dc" letter-spacing="-1">Back Your Team.</text>
    <text x="80" y="384" font-family="Arial Black, Arial, sans-serif"
          font-size="52" font-weight="900" fill="#dce4dc" letter-spacing="-1">Trade The Match.</text>
    <text x="80" y="450" font-family="Arial Black, Arial, sans-serif"
          font-size="52" font-weight="900" fill="#00ff87" letter-spacing="-1">Win The Cup.</text>

    <!-- Bottom strip -->
    <rect x="24" y="556" width="1152" height="50" fill="#00ff87" fill-opacity="0.05"/>
    <rect x="24" y="556" width="1152" height="1" fill="#1c2c1c"/>

    <!-- Bottom left: network info -->
    <text x="80" y="590" font-family="'Courier New', Courier, monospace"
          font-size="16" fill="#5a735a" letter-spacing="2">UNISWAP V4 · X LAYER TESTNET · CHAIN ID 1952</text>

    <!-- Bottom right: URL -->
    <text x="1120" y="590" font-family="'Courier New', Courier, monospace"
          font-size="16" fill="#dce4dc" fill-opacity="0.5"
          text-anchor="end" letter-spacing="1">e11even-men.vercel.app</text>

  </g>
</svg>
