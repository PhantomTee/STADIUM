<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c06"/>
      <stop offset="100%" stop-color="#0a180a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Pitch stripes -->
  <rect x="0"    y="0" width="110" height="630" fill="#00ff87" fill-opacity="0.018"/>
  <rect x="220"  y="0" width="110" height="630" fill="#00ff87" fill-opacity="0.018"/>
  <rect x="440"  y="0" width="110" height="630" fill="#00ff87" fill-opacity="0.018"/>
  <rect x="660"  y="0" width="110" height="630" fill="#00ff87" fill-opacity="0.018"/>
  <rect x="880"  y="0" width="110" height="630" fill="#00ff87" fill-opacity="0.018"/>
  <rect x="1100" y="0" width="110" height="630" fill="#00ff87" fill-opacity="0.018"/>

  <!-- Top glow band -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#glow)"/>

  <!-- Left green accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#00ff87"/>

  <!-- Large background "11°" watermark -->
  <text x="580" y="460" font-family="Arial Black, sans-serif" font-size="420" font-weight="900"
        fill="#00ff87" fill-opacity="0.035" text-anchor="middle" letter-spacing="-20">11°</text>

  <!-- Wordmark -->
  <text x="100" y="182" font-family="Arial Black, sans-serif" font-size="120" font-weight="900"
        fill="#ffffff" letter-spacing="-4">11°</text>

  <!-- Subtitle rule + label -->
  <rect x="100" y="210" width="48" height="3" fill="#00ff87"/>
  <text x="162" y="226" font-family="monospace" font-size="22" fill="#00ff87" letter-spacing="4" font-weight="700">WORLD CUP DEFI</text>

  <!-- Tagline -->
  <text x="100" y="310" font-family="Arial Black, sans-serif" font-size="52" font-weight="900"
        fill="#ffffff" letter-spacing="-1">Back Your Team.</text>
  <text x="100" y="376" font-family="Arial Black, sans-serif" font-size="52" font-weight="900"
        fill="#ffffff" letter-spacing="-1">Trade The Match.</text>
  <text x="100" y="442" font-family="Arial Black, sans-serif" font-size="52" font-weight="900"
        fill="#00ff87" letter-spacing="-1">Win The Cup.</text>

  <!-- Bottom strip -->
  <rect x="0" y="555" width="1200" height="75" fill="#00ff87" fill-opacity="0.06"/>
  <rect x="0" y="555" width="1200" height="2" fill="#00ff87" fill-opacity="0.25"/>

  <!-- Bottom details -->
  <text x="100" y="603" font-family="monospace" font-size="20" fill="#00ff87" letter-spacing="2">X LAYER TESTNET · CHAIN ID 1952</text>
  <text x="1100" y="603" font-family="monospace" font-size="20" fill="#ffffff" fill-opacity="0.4" text-anchor="end" letter-spacing="1">11DEG.XYZ</text>

  <!-- Ball icon (right side) -->
  <circle cx="960" cy="295" r="165" fill="none" stroke="#00ff87" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="960" cy="295" r="165" fill="#00ff87" fill-opacity="0.04"/>
  <!-- Pentagon center -->
  <polygon points="960,252 998,278 984,323 936,323 922,278" fill="none" stroke="#00ff87" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Seam lines -->
  <line x1="960" y1="130" x2="960" y2="252" stroke="#00ff87" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="1108" y1="222" x2="998" y2="278" stroke="#00ff87" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="1055" y1="432" x2="984" y2="323" stroke="#00ff87" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="865"  y1="432" x2="936" y2="323" stroke="#00ff87" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="812"  y1="222" x2="922" y2="278" stroke="#00ff87" stroke-width="2" stroke-opacity="0.35"/>
</svg>
