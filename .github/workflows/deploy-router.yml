name: Deploy StadiumRouter

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: "xlayer_testnet"
        type: choice
        options:
          - xlayer_testnet
          - xlayer_mainnet

jobs:
  deploy-router:
    name: Deploy router → ${{ github.event.inputs.network }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the updated xlayer.json back to the branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/jolly-einstein-SEDia

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge dependencies
        run: |
          forge install foundry-rs/forge-std@v1.9.7 --no-commit
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
          forge install Uniswap/v4-core@v4.0.0 --no-commit

      - name: Set RPC URL
        run: |
          if [ "${{ github.event.inputs.network }}" = "xlayer_mainnet" ]; then
            echo "RPC_URL=${{ secrets.XLAYER_MAINNET_RPC_URL }}" >> $GITHUB_ENV
          else
            echo "RPC_URL=https://testrpc.xlayer.tech/terigon" >> $GITHUB_ENV
          fi

      - name: Read PoolManager address from deployments config
        run: |
          POOL_MGR=$(python3 -c "
          import json
          d = json.load(open('frontend/src/config/deployments/xlayer.json'))
          print(d['poolManager'])
          ")
          echo "POOL_MANAGER_ADDRESS=$POOL_MGR" >> $GITHUB_ENV
          echo "PoolManager: $POOL_MGR"

      - name: Deploy StadiumRouter
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          forge script script/DeployRouter.s.sol \
            --rpc-url $RPC_URL \
            --broadcast \
            --private-key $PRIVATE_KEY \
            2>&1 | tee deploy-router.log

          # Extract the deployed address from forge output
          ROUTER=$(grep -oP 'StadiumRouter: \K0x[0-9a-fA-F]{40}' deploy-router.log | tail -1)
          if [ -z "$ROUTER" ]; then
            echo "ERROR: Could not parse StadiumRouter address from output"
            cat deploy-router.log
            exit 1
          fi
          echo "ROUTER_ADDRESS=$ROUTER" >> $GITHUB_ENV
          echo "StadiumRouter deployed at: $ROUTER"

      - name: Update xlayer.json with router address
        run: |
          python3 - <<'EOF'
          import json, os
          path = 'frontend/src/config/deployments/xlayer.json'
          with open(path) as f:
              d = json.load(f)
          d['stadiumRouter'] = os.environ['ROUTER_ADDRESS']
          with open(path, 'w') as f:
              json.dump(d, f, indent=2)
          print(f"Updated {path} with stadiumRouter: {os.environ['ROUTER_ADDRESS']}")
          EOF

      - name: Commit updated deployment config
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/config/deployments/xlayer.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: add stadiumRouter ${{ env.ROUTER_ADDRESS }} to xlayer.json"
          git push

      - name: Summary
        run: |
          echo "## StadiumRouter Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Network | ${{ github.event.inputs.network }} |" >> $GITHUB_STEP_SUMMARY
          echo "| StadiumRouter | \`${{ env.ROUTER_ADDRESS }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PoolManager | \`${{ env.POOL_MANAGER_ADDRESS }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Add to \`frontend/.env\`:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "VITE_STADIUM_ROUTER_ADDRESS=${{ env.ROUTER_ADDRESS }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
