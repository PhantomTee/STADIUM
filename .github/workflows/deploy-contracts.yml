name: Deploy Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: "xlayer_testnet"
        type: choice
        options:
          - xlayer_testnet
          - xlayer_mainnet
      step:
        description: "Which step to run"
        required: true
        default: "all"
        type: choice
        options:
          - all               # Deploy + Hook + SeedTeams + CreatePools + SeedLiquidity (no SeedMatches — uses live API)
          - core_only         # Deploy.s.sol only
          - hook_only         # DeployHook.s.sol only (needs POOL_MANAGER_ADDRESS secret)
          - seed_teams        # SeedTeams.s.sol only
          - pools_only        # CreatePools.s.sol only (needs TEAM_FACTORY + HOOK secrets)
          - liquidity_only    # SeedLiquidity.s.sol only (needs TEAM_FACTORY + HOOK secrets)
          - router_only       # DeployRouter.s.sol only (V4 swap router)
          - seed_matches      # SeedMatches.s.sol only
      force_redeploy:
        description: "Force re-deploy even if deployments.json already has valid addresses"
        required: false
        default: "false"
        type: boolean

# Only one deploy job per network at a time — prevents wallet nonce collisions.
concurrency:
  group: deploy-contracts-${{ github.event.inputs.network }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.network }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit deployments.json back to the branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/jolly-einstein-SEDia

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge dependencies
        run: |
          forge install foundry-rs/forge-std@v1.9.7 --no-commit
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-commit
          forge install Uniswap/v4-core@v4.0.0 --no-commit

      - name: Set RPC URL
        run: |
          if [ "${{ github.event.inputs.network }}" = "xlayer_mainnet" ]; then
            echo "RPC_URL=${{ secrets.XLAYER_MAINNET_RPC_URL }}" >> $GITHUB_ENV
          else
            echo "RPC_URL=${{ secrets.XLAYER_TESTNET_RPC_URL }}" >> $GITHUB_ENV
          fi

      # ── Check for existing deployment (skip redeploy unless forced) ───────────
      - name: Check existing deployment
        run: |
          tf=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d.get('teamFactory',''))" 2>/dev/null || echo "")
          if [ -n "$tf" ] && [ "$tf" != "0x0000000000000000000000000000000000000000" ]; then
            echo "SKIP_CORE_DEPLOY=true" >> $GITHUB_ENV
            echo "Core contracts already deployed (teamFactory=$tf) — skipping unless force_redeploy=true"
          fi
          sh=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d.get('stadiumHook',''))" 2>/dev/null || echo "")
          if [ -n "$sh" ] && [ "$sh" != "0x0000000000000000000000000000000000000000" ]; then
            echo "SKIP_HOOK_DEPLOY=true" >> $GITHUB_ENV
            echo "StadiumHook already deployed ($sh) — skipping unless force_redeploy=true"
          fi
          pools=$(python3 -c "import json; print(len(json.load(open('v4-pools.json')).get('pools',[])))" 2>/dev/null || echo "0")
          if [ "$pools" -gt "0" ] 2>/dev/null; then
            echo "SKIP_SEED_TEAMS=true" >> $GITHUB_ENV
            echo "SKIP_CREATE_POOLS=true" >> $GITHUB_ENV
            echo "Teams already seeded and $pools pools already created — skipping SeedTeams + CreatePools unless force_redeploy=true"
          fi

      # ── Step: Deploy core contracts ───────────────────────────────────────
      - name: Deploy core contracts (Deploy.s.sol)
        if: ${{ (github.event.inputs.step == 'all' || github.event.inputs.step == 'core_only') && (env.SKIP_CORE_DEPLOY != 'true' || github.event.inputs.force_redeploy == 'true') }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}
        run: |
          forge script script/Deploy.s.sol \
            --rpc-url $RPC_URL \
            --broadcast \
            --non-interactive \
            --private-key $PRIVATE_KEY

      # ── Step: Deploy StadiumHook (CREATE2 salt mining) ────────────────────
      - name: Deploy StadiumHook (DeployHook.s.sol)
        if: ${{ (github.event.inputs.step == 'all' || github.event.inputs.step == 'hook_only') && (env.SKIP_HOOK_DEPLOY != 'true' || github.event.inputs.force_redeploy == 'true') }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          POOL_MANAGER_ADDRESS: ${{ secrets.POOL_MANAGER_ADDRESS }}
        run: |
          # If POOL_MANAGER_ADDRESS not set as secret, read from deployments.json
          if [ -z "$POOL_MANAGER_ADDRESS" ] && [ -f deployments.json ]; then
            export POOL_MANAGER_ADDRESS=$(python3 -c "import sys,json; d=json.load(open('deployments.json')); print(d['poolManager'])")
          fi
          forge script script/DeployHook.s.sol \
            --rpc-url $RPC_URL \
            --broadcast \
            --non-interactive \
            --private-key $PRIVATE_KEY

      # ── Step: Seed MatchOracle + ConvictionVault teams (must run before CreatePools) ──
      # Teams must be registered in MatchOracle/ConvictionVault before users can
      # depositConviction(). Running this before CreatePools ensures correct ordering
      # in a full "all" deployment.
      - name: Seed teams (SeedTeams.s.sol)
        if: ${{ (github.event.inputs.step == 'all' || github.event.inputs.step == 'seed_teams') && (env.SKIP_SEED_TEAMS != 'true' || github.event.inputs.force_redeploy == 'true') }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          export MATCH_ORACLE_ADDRESS=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d['matchOracle'])")
          forge script script/SeedTeams.s.sol \
            --rpc-url $RPC_URL \
            --broadcast \
            --non-interactive \
            --private-key $PRIVATE_KEY

      # ── Step: Register teams + create V4 pools ─────────────────────────────
      - name: Create V4 pools (CreatePools.s.sol)
        if: ${{ (github.event.inputs.step == 'all' || github.event.inputs.step == 'pools_only') && (env.SKIP_CREATE_POOLS != 'true' || github.event.inputs.force_redeploy == 'true') }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          export TEAM_FACTORY_ADDRESS=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d['teamFactory'])")
          export STADIUM_HOOK_ADDRESS=$(python3 -c "import json,os; f='hook-deployment.json'; print(json.load(open(f)).get('stadiumHook','') if os.path.exists(f) else json.load(open('deployments.json')).get('stadiumHook',''))")
          forge script script/CreatePools.s.sol \
            --rpc-url $RPC_URL \
            --broadcast \
            --non-interactive \
            --private-key $PRIVATE_KEY

      # ── Step: Seed initial liquidity into V4 pools ─────────────────────────
      # Deploys StadiumLiquidityRouter and seeds each team pool so swaps work.
      # STADIUM_HOOK_ADDRESS: prefer hook-deployment.json (written by DeployHook in this
      # same run) because the merge step hasn't run yet at this point.
      - name: Seed liquidity (SeedLiquidity.s.sol)
        if: ${{ github.event.inputs.step == 'all' || github.event.inputs.step == 'liquidity_only' }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          export POOL_MANAGER_ADDRESS=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d.get('poolManager',''))")
          export TEAM_FACTORY_ADDRESS=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d['teamFactory'])")
          export MOCK_USDC_ADDRESS=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d['mockUSDC'])")
          export STADIUM_HOOK_ADDRESS=$(python3 -c "import json,os; f='hook-deployment.json'; print(json.load(open(f)).get('stadiumHook','') if os.path.exists(f) else json.load(open('deployments.json')).get('stadiumHook',''))")
          forge script script/SeedLiquidity.s.sol \
            --rpc-url $RPC_URL \
            --broadcast \
            --non-interactive \
            --private-key $PRIVATE_KEY

      # ── Step: Deploy StadiumRouter (V4 swap router) ─────────────────────
      - name: Deploy StadiumRouter (DeployRouter.s.sol)
        if: ${{ github.event.inputs.step == 'all' || github.event.inputs.step == 'router_only' }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          export POOL_MANAGER_ADDRESS=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d.get('poolManager',''))")
          forge script script/DeployRouter.s.sol \
            --rpc-url $RPC_URL \
            --broadcast \
            --non-interactive \
            --private-key $PRIVATE_KEY

      # ── Step: Seed match fixtures (manual only — not part of 'all') ──────
      # Real fixtures come from football-data.org via the backend keeper.
      # Only run this step explicitly via step=seed_matches for emergency use.
      - name: Seed matches (SeedMatches.s.sol)
        if: ${{ github.event.inputs.step == 'seed_matches' }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          export MATCH_ORACLE_ADDRESS=$(python3 -c "import json; d=json.load(open('deployments.json')); print(d['matchOracle'])")
          forge script script/SeedMatches.s.sol \
            --rpc-url $RPC_URL \
            --broadcast \
            --non-interactive \
            --private-key $PRIVATE_KEY

      # ── Merge router address into deployments.json ─────────────────────
      - name: Merge router-deployment.json into deployments.json
        if: ${{ always() && (github.event.inputs.step == 'all' || github.event.inputs.step == 'router_only') }}
        run: |
          if [ -f router-deployment.json ] && [ -f deployments.json ]; then
            python3 - <<'EOF'
          import json
          with open('deployments.json') as f:
              d = json.load(f)
          with open('router-deployment.json') as f:
              r = json.load(f)
          d['stadiumRouter'] = r.get('stadiumRouter', '')
          with open('deployments.json', 'w') as f:
              json.dump(d, f, indent=2)
          print("Merged stadiumRouter into deployments.json")
          EOF
          fi

      # ── Merge hook address into deployments.json ─────────────────────
      - name: Merge hook-deployment.json into deployments.json
        if: ${{ always() && (github.event.inputs.step == 'all' || github.event.inputs.step == 'hook_only') }}
        run: |
          if [ -f hook-deployment.json ] && [ -f deployments.json ]; then
            python3 - <<'EOF'
          import json
          with open('deployments.json') as f:
              d = json.load(f)
          with open('hook-deployment.json') as f:
              h = json.load(f)
          d['stadiumHook'] = h.get('stadiumHook', '')
          d['poolManager']  = h.get('poolManager', d.get('poolManager',''))
          with open('deployments.json', 'w') as f:
              json.dump(d, f, indent=2)
          print("Merged hook address into deployments.json")
          EOF
          fi

      # ── Merge liquidity router address into deployments.json ───────────────
      - name: Merge liquidity-deployment.json into deployments.json
        if: ${{ always() && (github.event.inputs.step == 'all' || github.event.inputs.step == 'liquidity_only') }}
        run: |
          if [ -f liquidity-deployment.json ] && [ -f deployments.json ]; then
            python3 - <<'EOF'
          import json
          with open('deployments.json') as f:
              d = json.load(f)
          with open('liquidity-deployment.json') as f:
              l = json.load(f)
          d['stadiumLiquidityRouter'] = l.get('stadiumLiquidityRouter', '')
          with open('deployments.json', 'w') as f:
              json.dump(d, f, indent=2)
          print("Merged stadiumLiquidityRouter into deployments.json")
          EOF
          fi

      # ── Commit deployment artifacts back to branch ───────────────────────
      - name: Commit deployment artifacts
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy deployments.json into frontend config
          if [ -f deployments.json ]; then
            cp deployments.json frontend/src/config/deployments/xlayer.json
          fi

          git add deployments.json hook-deployment.json liquidity-deployment.json router-deployment.json v4-pools.json \
                  frontend/src/config/deployments/xlayer.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update deployment artifacts [${{ github.event.inputs.network }}]"
          git push

      # ── Print summary ────────────────────────────────────────────────────────
      - name: Print deployment summary
        if: always()
        run: |
          echo "=== DEPLOYMENT SUMMARY ==="
          cat deployments.json 2>/dev/null || echo "deployments.json not found"
          echo ""
          cat hook-deployment.json 2>/dev/null || echo "hook-deployment.json not found"
          echo ""
          cat liquidity-deployment.json 2>/dev/null || echo "liquidity-deployment.json not found"
          echo ""
          cat router-deployment.json 2>/dev/null || echo "router-deployment.json not found"
          echo ""
          cat v4-pools.json 2>/dev/null || echo "v4-pools.json not found"
